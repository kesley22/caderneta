<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6e6a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caderneta">
<title>Caderneta — gastos e metas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#e9efee;--surface:#f8fbfa;--ink:#12262b;--muted:#5b6f73;--line:#cbd8d6;
  --out:#c2453a;--in:#0f6e6a;--goal:#b7860b;--track:#d7e2e0;--btn:#12262b;--btn-ink:#f8fbfa;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a1d;--surface:#15262a;--ink:#e6f0ee;--muted:#93a9ad;--line:#27403f;
    --out:#ee7f73;--in:#4fc2b8;--goal:#e6b84a;--track:#22393a;--btn:#e6f0ee;--btn-ink:#0e1a1d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a1d;--surface:#15262a;--ink:#e6f0ee;--muted:#93a9ad;--line:#27403f;
  --out:#ee7f73;--in:#4fc2b8;--goal:#e6b84a;--track:#22393a;--btn:#e6f0ee;--btn-ink:#0e1a1d;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1,h2,.big{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;letter-spacing:-.02em}
h1{font-size:1.5rem;margin:0}
h2{font-size:1.15rem;margin:0 0 12px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.month{display:flex;align-items:center;gap:6px}
.month span{min-width:150px;text-align:center;font-weight:700;text-transform:capitalize}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px}
button.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn);font-weight:700}
button.link{border:0;background:none;color:var(--muted);padding:4px 6px;text-decoration:underline}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--in);outline-offset:2px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}
.hero .big{font-size:clamp(2.4rem,9vw,4rem);font-weight:800;line-height:1.05;margin:2px 0 4px}
.hero .big.neg{color:var(--out)}
.lbl{color:var(--muted);font-size:.9rem}
.split{display:flex;height:12px;border-radius:6px;background:var(--track);overflow:hidden;margin:16px 0 10px}
.split i{display:block;background:var(--out);height:100%}
.flow{display:flex;gap:28px;flex-wrap:wrap}
.flow b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.25rem}
.in{color:var(--in)}.out{color:var(--out)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card.full{grid-column:1/-1}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form .span2{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.seg{display:flex;gap:0}
.seg label{flex-direction:row;align-items:center;justify-content:center;flex:1;border:1px solid var(--line);padding:8px;cursor:pointer;color:var(--ink)}
.seg label:first-child{border-radius:8px 0 0 8px}.seg label:last-child{border-radius:0 8px 8px 0;border-left:0}
.seg input{width:auto;margin-right:6px}
.row{padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.rowtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--in)}
.bar.over i{background:var(--out)}
.bar.goal i{background:var(--goal)}
.lim{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.lim input{width:100px;padding:4px 8px}
.dep{display:flex;gap:6px;margin-top:8px}
.dep input{width:110px;padding:6px 8px}
.tx{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tx:first-of-type{border-top:0}
.tx small{color:var(--muted);display:block}
.empty{color:var(--muted);margin:4px 0}
.scroll{overflow-x:auto}
.head2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.head2 h2{margin:0}
.toggle{display:flex}
.toggle button{border-radius:0;padding:6px 12px}
.toggle button:first-child{border-radius:8px 0 0 8px}
.toggle button:last-child{border-radius:0 8px 8px 0;border-left:0}
.toggle button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn);font-weight:700}
.donut{width:210px;max-width:100%;display:block;margin:4px auto 14px}
.donut .dv{font:700 3.3px "Bricolage Grotesque",sans-serif;fill:var(--ink)}
.donut .dl{font:400 2.2px "DM Sans",sans-serif;fill:var(--muted)}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:8px;vertical-align:-1px}
.addcat{display:flex;gap:6px;margin-top:14px}
.addcat input{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.tabs button{white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn);font-weight:700}
.paytot{font:800 1.6rem "Bricolage Grotesque",sans-serif;margin:0 0 2px}
body.locked .wrap{display:none}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#lock[hidden]{display:none}
.lockbox{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.lockbox form{grid-template-columns:1fr}
.lockbox p{margin:0 0 14px}
.err{color:var(--out);min-height:1.4em;margin:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:no-preference){.bar i,.split i{transition:width .35s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Caderneta</h1>
    <div class="month">
      <button type="button" data-a="prev" aria-label="Mês anterior">‹</button>
      <span id="mlabel"></span>
      <button type="button" data-a="next" aria-label="Próximo mês">›</button>
    </div>
  </header>

  <section class="hero" id="hero"></section>

  <div class="grid">
    <section class="card">
      <h2>Novo lançamento</h2>
      <form id="txform">
        <div class="seg span2" role="radiogroup" aria-label="Tipo">
          <label><input type="radio" name="kind" value="out" checked>Gasto</label>
          <label><input type="radio" name="kind" value="in">Receita</label>
        </div>
        <label class="span2">Descrição<input name="desc" required maxlength="60" placeholder="Ex.: Feira da semana"></label>
        <label>Valor (R$)<input name="amt" type="number" step="0.01" min="0.01" inputmode="decimal" required></label>
        <label>Data<input name="date" type="date" required></label>
        <label class="span2">Categoria<select name="cat" id="catsel"></select></label>
        <label class="span2" id="paywrap">Pagamento<select name="pay" id="paysel"></select></label>
        <button class="primary span2" type="submit">Salvar lançamento</button>
      </form>
    </section>

    <section class="card">
      <div class="head2"><h2>Categorias de gastos</h2>
        <div class="toggle" role="group" aria-label="Modo de exibição">
          <button type="button" id="m-list" data-a="mode" data-mode="list" aria-pressed="true">Categorias</button>
          <button type="button" id="m-chart" data-a="mode" data-mode="chart" aria-pressed="false">Gráfico</button>
        </div></div>
      <div id="cats"></div>
      <form id="catform" class="addcat">
        <input name="cname" maxlength="24" placeholder="Nova categoria" aria-label="Nova categoria" required>
        <button type="submit">Adicionar</button>
      </form>
    </section>

    <section class="card">
      <h2>Metas de economia</h2>
      <div id="goals"></div>
      <form id="goalform" style="margin-top:14px">
        <label>Nova meta<input name="gname" required maxlength="40" placeholder="Ex.: Reserva de emergência"></label>
        <label>Valor alvo (R$)<input name="gtarget" type="number" step="0.01" min="1" inputmode="decimal" required></label>
        <button class="primary span2" type="submit">Criar meta</button>
      </form>
    </section>

    <section class="card">
      <h2>Lançamentos do mês</h2>
      <div id="txs"></div>
    </section>

    <section class="card full">
      <h2>Por forma de pagamento</h2>
      <div class="tabs" id="paytabs" role="tablist" aria-label="Formas de pagamento"></div>
      <div id="paybody"></div>
      <p class="lbl" id="paymsg" role="status"></p>
      <form id="cardform" class="addcat">
        <input name="cardname" maxlength="24" placeholder="Novo cartão (ex.: Nubank)" aria-label="Novo cartão" required>
        <button type="submit">Adicionar cartão</button>
      </form>
    </section>

    <section class="card full">
      <h2>Seus dados</h2>
      <p class="lbl">Os dados ficam só neste aparelho. Exporte um backup de vez em quando e guarde o arquivo em um lugar seguro.</p>
      <div class="btnrow">
        <button type="button" class="primary" id="bk-export">Exportar backup</button>
        <button type="button" id="bk-import">Importar backup</button>
        <button type="button" id="bk-lock"></button>
        <input type="file" id="bk-file" accept="application/json,.json" hidden>
      </div>
      <p class="lbl" id="bkmsg" role="status" style="margin-top:10px"></p>
    </section>
  </div>
</div>

<div id="lock" hidden>
  <div class="lockbox">
    <h2 id="lk-title"></h2>
    <p class="lbl" id="lk-text"></p>
    <form id="lkform" autocomplete="off">
      <label id="lk-namewrap">Seu nome<input name="lname" maxlength="30"></label>
      <label>PIN (4 a 6 números)<input name="lpin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" required autocomplete="off"></label>
      <p class="err" id="lk-err" role="alert"></p>
      <div class="btnrow">
        <button class="primary" type="submit" id="lk-submit"></button>
        <button type="button" class="link" id="lk-skip">Pular por enquanto</button>
        <button type="button" class="link" id="lk-forgot">Esqueci meu PIN</button>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  var KEY='caderneta-v1';
  var BASE=['Moradia','Mercado','Comida','Transporte','Lazer','Saúde','Educação','Outros'];
  var CATS=BASE.slice();
  var S={tx:[],limits:{},goals:[],custom:[],mode:'list',cards:['Crédito']};
  try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);S.tx=p.tx||[];S.limits=p.limits||{};S.goals=p.goals||[];S.custom=p.custom||[];S.mode=p.mode==='chart'?'chart':'list';S.cards=(Array.isArray(p.cards)&&p.cards.length)?p.cards:['Crédito'];}}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
  CATS=CATS.concat(S.custom);
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function brl(n){return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
  function pad(n){return n<10?'0'+n:''+n;}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

  var now=new Date();
  var view={y:now.getFullYear(),m:now.getMonth()};
  function mkey(){return view.y+'-'+pad(view.m+1);}
  function today(){return now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());}

  var form=$('txform');
  form.date.value=today();
  function fillSel(){$('catsel').innerHTML=CATS.map(function(c){return '<option>'+c+'</option>';}).join('');}
  fillSel();
  function pays(){return ['Pix','Débito','Dinheiro'].concat(S.cards);}
  function fillPay(){$('paysel').innerHTML=pays().map(function(c){return '<option>'+c+'</option>';}).join('');}
  fillPay();

  function monthTx(){return S.tx.filter(function(t){return t.date.slice(0,7)===mkey();});}

  var payTab='Todos';
  function renderPay(tx){
    var ex=tx.filter(function(t){return t.kind==='out';});
    var names=pays(),tot={},sum=0;
    ex.forEach(function(t){
      var k=(t.pay&&names.indexOf(t.pay)>=0)?t.pay:'Sem forma';
      tot[k]=(tot[k]||0)+t.amt;sum+=t.amt;
    });
    if(payTab!=='Todos'&&names.indexOf(payTab)<0)payTab='Todos';
    $('paytabs').innerHTML=['Todos'].concat(names).map(function(n){
      var v=n==='Todos'?sum:(tot[n]||0);
      return '<button type="button" role="tab" aria-selected="'+(n===payTab)+'" data-a="paytab" data-t="'+n+'">'+n+' · '+brl(v)+'</button>';
    }).join('');
    var h='';
    if(payTab==='Todos'){
      var keys=names.concat(tot['Sem forma']?['Sem forma']:[]);
      h=sum>0?keys.map(function(n){
        var v=tot[n]||0,w=v/sum*100;
        return '<div class="row"><div class="rowtop"><b>'+n+'</b><span>'+brl(v)+' · '+Math.round(w)+'%</span></div><div class="bar"><i style="width:'+w.toFixed(1)+'%"></i></div></div>';
      }).join(''):'<p class="empty">Sem gastos neste mês.</p>';
    }else{
      var mine=ex.filter(function(t){return t.pay===payTab;}).sort(function(a,b){return b.date.localeCompare(a.date);});
      var bc={},t0=tot[payTab]||0;
      mine.forEach(function(t){bc[t.cat]=(bc[t.cat]||0)+t.amt;});
      h='<p class="paytot out">'+brl(t0)+'</p><p class="lbl">'+mine.length+' gasto(s) neste mês</p>';
      if(mine.length){
        h+=Object.keys(bc).sort(function(a,b){return bc[b]-bc[a];}).map(function(c){
          var w=bc[c]/t0*100;
          return '<div class="row"><div class="rowtop"><span>'+esc(c)+'</span><span>'+brl(bc[c])+'</span></div><div class="bar"><i style="width:'+w.toFixed(1)+'%"></i></div></div>';
        }).join('');
        h+='<h2 style="margin-top:16px">Lançamentos</h2>'+mine.map(function(t){
          return '<div class="tx"><div><b>'+esc(t.desc)+'</b><small>'+t.date.slice(8,10)+'/'+t.date.slice(5,7)+' · '+esc(t.cat)+'</small></div><b class="out">− '+brl(t.amt)+'</b></div>';
        }).join('');
      }else h+='<p class="empty">Nenhum gasto nesta forma de pagamento neste mês.</p>';
      if(S.cards.indexOf(payTab)>=0)h+='<p><button type="button" class="link" data-a="delcard" data-t="'+payTab+'">Remover este cartão</button></p>';
    }
    $('paybody').innerHTML=h;
  }

  function colorOf(c){return 'hsl('+((CATS.indexOf(c)*47+160)%360)+' 58% 50%)';}
  function chartHTML(byCat,exp){
    if(!(exp>0))return '<p class="empty">Sem gastos neste mês para mostrar no gráfico.</p>';
    var items=CATS.filter(function(c){return (byCat[c]||0)>0;}).sort(function(a,b){return byCat[b]-byCat[a];});
    var off=25,segs='';
    items.forEach(function(c){
      var p=byCat[c]/exp*100;
      segs+='<circle cx="21" cy="21" r="15.915" fill="none" stroke="'+colorOf(c)+'" stroke-width="6" stroke-dasharray="'+p.toFixed(3)+' '+(100-p).toFixed(3)+'" stroke-dashoffset="'+off.toFixed(3)+'"></circle>';
      off-=p;
    });
    var legend=items.map(function(c){
      return '<div class="row"><div class="rowtop"><span><i class="sw" style="background:'+colorOf(c)+'"></i><b>'+c+'</b></span><span>'+brl(byCat[c])+' · '+Math.round(byCat[c]/exp*100)+'%</span></div></div>';
    }).join('');
    return '<svg class="donut" viewBox="0 0 42 42" role="img" aria-label="Gastos do mês por categoria"><circle cx="21" cy="21" r="15.915" fill="none" stroke="var(--track)" stroke-width="6"></circle>'+segs+'<text x="21" y="20" text-anchor="middle" class="dl">Gastos</text><text x="21" y="24.2" text-anchor="middle" class="dv">'+brl(exp)+'</text></svg>'+legend;
  }

  function render(){
    var label=new Date(view.y,view.m,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    $('mlabel').textContent=label;
    $('m-list').setAttribute('aria-pressed',S.mode==='chart'?'false':'true');
    $('m-chart').setAttribute('aria-pressed',S.mode==='chart'?'true':'false');
    var tx=monthTx();
    var inc=0,exp=0,byCat={};
    tx.forEach(function(t){
      if(t.kind==='in')inc+=t.amt;else{exp+=t.amt;byCat[t.cat]=(byCat[t.cat]||0)+t.amt;}
    });
    var saldo=inc-exp;
    var isNow=view.y===now.getFullYear()&&view.m===now.getMonth();
    var daysLeft=new Date(view.y,view.m+1,0).getDate()-now.getDate()+1;
    var note;
    if(inc===0&&exp===0)note='Registre sua primeira receita ou gasto do mês para começar.';
    else if(saldo<=0)note='Os gastos já alcançaram as receitas deste mês.';
    else if(isNow)note='Dá para gastar cerca de '+brl(saldo/daysLeft)+' por dia até o fim do mês.';
    else note='Sobrou nesse mês.';
    var pct=inc>0?Math.min(100,exp/inc*100):(exp>0?100:0);
    $('hero').innerHTML=
      '<div class="lbl">Saldo do mês</div>'+
      '<div class="big'+(saldo<0?' neg':'')+'">'+brl(saldo)+'</div>'+
      '<div class="lbl">'+esc(note)+'</div>'+
      '<div class="split" aria-hidden="true"><i style="width:'+pct.toFixed(1)+'%"></i></div>'+
      '<div class="flow"><div><div class="lbl">Receitas</div><b class="in">'+brl(inc)+'</b></div>'+
      '<div><div class="lbl">Gastos</div><b class="out">'+brl(exp)+'</b></div></div>';

    $('cats').innerHTML=S.mode==='chart'?chartHTML(byCat,exp):CATS.map(function(c){
      var spent=byCat[c]||0,lim=S.limits[c]||0;
      var over=lim>0&&spent>lim;
      var w=lim>0?Math.min(100,spent/lim*100):0;
      var info=lim>0?(over?'Passou '+brl(spent-lim):'Resta '+brl(lim-spent)):'Sem limite definido';
      return '<div class="row"><div class="rowtop"><b>'+c+'</b><span>'+brl(spent)+'</span></div>'+
        '<div class="bar'+(over?' over':'')+'"><i style="width:'+w.toFixed(1)+'%"></i></div>'+
        '<div class="rowtop" style="margin-top:6px"><span class="lbl">'+info+'</span>'+
        '<label class="lim">Limite<input type="number" min="0" step="10" inputmode="decimal" data-limit="'+c+'" value="'+(lim||'')+'" aria-label="Limite de '+c+'"></label></div></div>';
    }).join('');

    $('goals').innerHTML=S.goals.length?S.goals.map(function(g){
      var w=Math.min(100,g.saved/g.target*100);
      return '<div class="row"><div class="rowtop"><b>'+esc(g.name)+'</b><button type="button" class="link" data-a="delgoal" data-id="'+g.id+'">Excluir</button></div>'+
        '<div class="bar goal"><i style="width:'+w.toFixed(1)+'%"></i></div>'+
        '<div class="rowtop" style="margin-top:6px"><span class="lbl">'+brl(g.saved)+' de '+brl(g.target)+'</span><span class="lbl">'+Math.floor(w)+'%</span></div>'+
        '<div class="dep"><input type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="Valor" aria-label="Valor a guardar em '+esc(g.name)+'">'+
        '<button type="button" data-a="dep" data-id="'+g.id+'">Guardar</button></div></div>';
    }).join(''):'<p class="empty">Nenhuma meta ainda. Crie a primeira abaixo.</p>';

    var list=tx.slice().sort(function(a,b){return b.date.localeCompare(a.date);});
    $('txs').innerHTML=list.length?list.map(function(t){
      var d=t.date.slice(8,10)+'/'+t.date.slice(5,7);
      return '<div class="tx"><div><b>'+esc(t.desc)+'</b><small>'+d+' · '+esc(t.cat)+(t.pay?' · '+esc(t.pay):'')+'</small></div>'+
        '<div style="text-align:right"><b class="'+(t.kind==='in'?'in':'out')+'">'+(t.kind==='in'?'+ ':'− ')+brl(t.amt)+'</b>'+
        '<br><button type="button" class="link" data-a="deltx" data-id="'+t.id+'">Excluir</button></div></div>';
    }).join(''):'<p class="empty">Nenhum lançamento neste mês.</p>';
    renderPay(tx);
  }

  form.addEventListener('submit',function(e){
    e.preventDefault();
    var f=form,amt=parseFloat(f.amt.value);
    if(!(amt>0))return;
    var t={id:uid(),kind:f.kind.value,desc:f.desc.value.trim(),amt:amt,date:f.date.value,cat:f.kind.value==='in'?'Receita':f.cat.value,pay:f.kind.value==='in'?'':f.pay.value};
    S.tx.push(t);save();
    view.y=+t.date.slice(0,4);view.m=+t.date.slice(5,7)-1;
    f.desc.value='';f.amt.value='';f.desc.focus();
    render();
  });

  $('goalform').addEventListener('submit',function(e){
    e.preventDefault();
    var f=e.target,target=parseFloat(f.gtarget.value);
    if(!(target>0))return;
    S.goals.push({id:uid(),name:f.gname.value.trim(),target:target,saved:0});
    save();f.reset();render();
  });

  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-a]');
    if(!b)return;
    var a=b.getAttribute('data-a'),id=b.getAttribute('data-id');
    if(a==='prev'||a==='next'){
      view.m+=a==='next'?1:-1;
      if(view.m<0){view.m=11;view.y--;}
      if(view.m>11){view.m=0;view.y++;}
    }else if(a==='paytab'){
      payTab=b.getAttribute('data-t');$('paymsg').textContent='';
    }else if(a==='delcard'){
      var cn=b.getAttribute('data-t');
      if(S.tx.some(function(t){return t.pay===cn;})){$('paymsg').textContent='Este cartão já tem lançamentos e não pode ser removido.';}
      else{S.cards=S.cards.filter(function(x){return x!==cn;});save();fillPay();payTab='Todos';$('paymsg').textContent='';}
    }else if(a==='mode'){
      S.mode=b.getAttribute('data-mode')==='chart'?'chart':'list';save();
    }else if(a==='deltx'){
      S.tx=S.tx.filter(function(t){return t.id!==id;});save();
    }else if(a==='delgoal'){
      S.goals=S.goals.filter(function(g){return g.id!==id;});save();
    }else if(a==='dep'){
      var inp=b.previousElementSibling,v=parseFloat(inp.value);
      if(!(v>0))return;
      S.goals.forEach(function(g){if(g.id===id)g.saved+=v;});save();
    }
    render();
  });

  document.addEventListener('change',function(e){
    var c=e.target.getAttribute&&e.target.getAttribute('data-limit');
    if(!c)return;
    var v=parseFloat(e.target.value);
    S.limits[c]=v>0?v:0;save();render();
  });

  $('catform').addEventListener('submit',function(e){
    e.preventDefault();
    var f=e.target,n=f.cname.value.replace(/[<>&"']/g,'').trim().slice(0,24);
    if(n&&!CATS.some(function(c){return c.toLowerCase()===n.toLowerCase();})){
      S.custom.push(n);CATS.push(n);save();fillSel();
    }
    f.reset();render();
  });

  /* ---- Backup ---- */
  function say(t){$('bkmsg').textContent=t;}
  function sid(x){return String(x||'').replace(/[^\w-]/g,'').slice(0,30)||uid();}
  function cleanName(n){return String(n).replace(/[<>&"']/g,'').trim().slice(0,24);}
  function exportBackup(){
    var data={app:'caderneta',version:1,exportedAt:new Date().toISOString(),tx:S.tx,limits:S.limits,goals:S.goals,custom:S.custom,cards:S.cards};
    var url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
    var a=document.createElement('a');a.href=url;a.download='caderneta-backup-'+today()+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},1500);
    say('Backup gerado. Guarde o arquivo em um lugar seguro.');
  }
  function importBackup(file){
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result);
        if(d.app!=='caderneta'||!Array.isArray(d.tx)||!Array.isArray(d.goals))throw new Error('formato');
        if(!confirm('Importar vai substituir os dados atuais deste aparelho. Continuar?'))return;
        S.tx=d.tx.filter(function(t){return t&&typeof t.amt==='number'&&typeof t.desc==='string'&&typeof t.date==='string'&&t.date.length===10;})
          .map(function(t){return {id:sid(t.id),kind:t.kind==='in'?'in':'out',desc:t.desc.slice(0,60),amt:t.amt,date:t.date,cat:String(t.cat||'Outros'),pay:t.pay?cleanName(t.pay):''};});
        S.goals=d.goals.filter(function(g){return g&&typeof g.name==='string'&&typeof g.target==='number'&&typeof g.saved==='number';})
          .map(function(g){return {id:sid(g.id),name:g.name.slice(0,40),target:g.target,saved:g.saved};});
        S.custom=(Array.isArray(d.custom)?d.custom:[]).map(cleanName).filter(Boolean);
        S.cards=(Array.isArray(d.cards)?d.cards:[]).map(cleanName).filter(function(x){return x&&['pix','débito','debito','dinheiro','todos'].indexOf(x.toLowerCase())<0;});
        if(!S.cards.length)S.cards=['Crédito'];
        fillPay();
        S.limits={};
        Object.keys(d.limits||{}).forEach(function(k){var v=parseFloat(d.limits[k]);if(v>0)S.limits[cleanName(k)]=v;});
        CATS=BASE.concat(S.custom);
        save();fillSel();render();
        say('Backup importado: '+S.tx.length+' lançamentos e '+S.goals.length+' metas.');
      }catch(err){say('Não foi possível ler esse arquivo. Use um backup gerado pelo Caderneta.');}
    };
    r.readAsText(file);
  }
  $('bk-export').addEventListener('click',exportBackup);
  $('bk-import').addEventListener('click',function(){$('bk-file').click();});
  $('bk-file').addEventListener('change',function(e){var f=e.target.files[0];if(f)importBackup(f);e.target.value='';});

  /* ---- Login com PIN (local, neste aparelho) ---- */
  var AK='caderneta-auth',SK='caderneta-skip',lock=$('lock'),lf=$('lkform'),mode='unlock',auth=null;
  try{auth=JSON.parse(localStorage.getItem(AK)||'null');}catch(e){}
  if(!(auth&&auth.salt&&auth.hash))auth=null;
  function hashPin(pin,salt){
    if(window.crypto&&crypto.subtle){
      return crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin)).then(function(b){
        return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');
      });
    }
    return Promise.resolve(btoa(salt+':'+pin));
  }
  function show(id,on){$(id).style.display=on?'':'none';}
  function openLock(m){
    mode=m;var create=m==='create';
    lock.hidden=false;document.body.classList.add('locked');
    $('lk-title').textContent=create?'Proteger com PIN':'Olá, '+(auth?auth.name:'');
    $('lk-text').textContent=create?'Crie um PIN de 4 a 6 números para abrir o app. Ele fica só neste aparelho.':'Digite seu PIN para entrar.';
    $('lk-submit').textContent=create?'Criar acesso':'Entrar';
    lf.lname.required=create;
    show('lk-namewrap',create);show('lk-skip',create);show('lk-forgot',!create);
    $('lk-err').textContent='';lf.lpin.focus();
  }
  function closeLock(){lock.hidden=true;document.body.classList.remove('locked');lf.reset();$('lk-err').textContent='';}
  function refreshLockBtn(){$('bk-lock').textContent=auth?'Bloquear agora':'Criar acesso com PIN';}
  lf.addEventListener('submit',function(e){
    e.preventDefault();
    var pin=lf.lpin.value,err=$('lk-err');err.textContent='';
    if(!/^\d{4,6}$/.test(pin)){err.textContent='Use de 4 a 6 números no PIN.';return;}
    if(mode==='create'){
      var name=lf.lname.value.replace(/\s+/g,' ').trim().slice(0,30);
      if(!name){err.textContent='Informe seu nome.';return;}
      var salt=uid();
      hashPin(pin,salt).then(function(h){
        auth={name:name,salt:salt,hash:h};
        try{localStorage.setItem(AK,JSON.stringify(auth));}catch(x){}
        closeLock();refreshLockBtn();say('Acesso criado. Use "Bloquear agora" quando quiser.');
      });
    }else{
      hashPin(pin,auth.salt).then(function(h){
        if(h===auth.hash)closeLock();
        else{err.textContent='PIN incorreto. Tente de novo.';lf.lpin.value='';}
      });
    }
  });
  $('lk-skip').addEventListener('click',function(){try{localStorage.setItem(SK,'1');}catch(x){}closeLock();});
  $('lk-forgot').addEventListener('click',function(){
    if(!confirm('Sem o PIN, a única saída é apagar todos os dados deste aparelho. Depois você pode restaurar pelo arquivo de backup. Apagar tudo?'))return;
    try{localStorage.removeItem(KEY);localStorage.removeItem(AK);}catch(x){}
    location.reload();
  });
  $('bk-lock').addEventListener('click',function(){openLock(auth?'unlock':'create');});
  refreshLockBtn();
  if(auth)openLock('unlock');
  else{var sk=null;try{sk=localStorage.getItem(SK);}catch(x){}if(!sk)openLock('create');}

  $('cardform').addEventListener('submit',function(e){
    e.preventDefault();
    var f=e.target,n=cleanName(f.cardname.value),msg=$('paymsg');msg.textContent='';
    if(n){
      var taken=pays().concat(['Todos','Sem forma']).some(function(x){return x.toLowerCase()===n.toLowerCase();});
      if(taken)msg.textContent='Já existe uma forma de pagamento com esse nome.';
      else{S.cards.push(n);save();fillPay();payTab=n;}
    }
    f.reset();render();
  });
  form.addEventListener('change',function(e){
    if(e.target.name!=='kind')return;
    var inc=e.target.value==='in';
    $('paywrap').style.display=inc?'none':'';
    $('catsel').parentNode.style.display=inc?'none':'';
  });

  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}

  render();
})();
</script>
</body>
</html>
